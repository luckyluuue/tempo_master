<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121314">
    <meta name="description" content="PolyPulse Practice is a polyrhythm and metronome practice tool. / ポリリズムとメトロノームを練習するツールです。">
    <title>PolyPulse Practice</title>
    <link rel="canonical" href="https://luckyluuue.github.io/tempo_master/">
    <link rel="alternate" hreflang="ja" href="https://luckyluuue.github.io/tempo_master/ja/">
    <link rel="alternate" hreflang="en" href="https://luckyluuue.github.io/tempo_master/en/">
    <link rel="alternate" hreflang="es" href="https://luckyluuue.github.io/tempo_master/es/">
    <link rel="alternate" hreflang="x-default" href="https://luckyluuue.github.io/tempo_master/">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <style>
      :root {
        color-scheme: dark;
        background: #121314;
        color: #f4f0e8;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
      }

      main {
        width: min(420px, calc(100% - 32px));
      }

      h1 {
        margin: 0 0 14px;
        font-size: 2rem;
      }

      p {
        color: #b8b1a5;
        line-height: 1.6;
      }

      a {
        color: #e8d783;
      }
    </style>
    <script>
      const language = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      const target = language.startsWith("ja") ? "ja/" : language.startsWith("es") ? "es/" : "en/";
      window.location.replace(target);
    </script>
  </head>
  <body>
    <main>
      <h1>PolyPulse Practice</h1>
      <p>Choose a language / 言語を選択してください / Elige un idioma</p>
      <p><a href="ja/">日本語</a> · <a href="en/">English</a> · <a href="es/">Español</a></p>
    </main>
  </body>
</html>
